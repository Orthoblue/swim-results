<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Swimming Results</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#222}
.wrap{max-width:960px;margin:0 auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:1.5rem}
input{width:100%;max-width:480px;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee}
th{background:#e8f0fe}
.row{cursor:pointer}.row:hover{background:#f0f7ff}
.time{font-family:monospace;font-weight:600;color:#1a73e8}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Swimming Results</h1>
<p style="color:#555">Search all athletes. Click a name to see races.</p>
<input id="q" placeholder="Type a name..." oninput="go()">
<div id="status" style="color:#666;font-size:13px;margin:8px 0"></div>
<div id="list"></div>
<div id="detail"></div>
</div>
</div>
<script>var A=[];</script>
<script src="a0.js"></script>
<script src="a1.js"></script>
<script src="a2.js"></script>
<script src="a3.js"></script>
<script src="a4.js"></script>
<script>
function go(){
  var q=document.getElementById("q").value.toLowerCase().trim();
  var list=document.getElementById("list");
  var status=document.getElementById("status");
  var detail=document.getElementById("detail");
  detail.innerHTML="";
  if(q.length<2){list.innerHTML="";status.textContent="Type at least 2 characters";return}
  var m=A.filter(function(a){return a.n.toLowerCase().indexOf(q)!==-1});
  status.textContent=m.length+" match"+(m.length===1?"":"es")+" of "+A.length;
  if(!m.length){list.innerHTML="<p>No matches</p>";return}
  var h="<table><tr><th>Name</th><th>Results</th></tr>";
  for(var i=0;i<Math.min(m.length,15);i++){
    h+='<tr class="row" data-n="'+m[i].n.replace(/"/g,'"')+'"><td>'+m[i].n+'</td><td>'+m[i].c+'</td></tr>';
  }
  h+="</table>";
  list.innerHTML=h;
  document.querySelectorAll(".row").forEach(function(r){
    r.onclick=function(){show(this.getAttribute("data-n"))};
  });
  if(m.length===1) show(m[0].n);
  else detail.innerHTML='<p style="color:#666;margin-top:8px">Click an athlete to see races</p>';
}
function show(n){
  var a=A.find(function(x){return x.n===n});
  if(!a)return;
  var h="<h3>"+n+" — "+a.c+" results</h3><table><tr><th>Event</th><th>Time</th><th>RT</th><th>Place</th><th>Meet</th><th>Date</th></tr>";
  for(var i=0;i<a.r.length;i++){
    var r=a.r[i];
    var rt=r.rt!=null?Number(r.rt).toFixed(2):"—";
    h+="<tr><td>"+r.e+"</td><td class='time'>"+r.t+"</td><td>"+rt+"</td><td>"+(r.p||"—")+"</td><td>"+r.m+"</td><td>"+r.d+"</td></tr>";
  }
  h+="</table>";
  document.getElementById("detail").innerHTML=h;
}
</script>
<p style="text-align:center;color:#999;font-size:12px;padding:12px">Live dashboard · loading more athletes</p>
</body>
</html>
