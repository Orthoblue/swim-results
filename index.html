<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Swimming Results</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f8;color:#222}
.wrap{max-width:900px;margin:0 auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:1.5rem}
input{width:100%;max-width:440px;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee}
th{background:#e8f0fe}
.row{cursor:pointer}.row:hover{background:#f0f7ff}
.time{font-family:monospace;font-weight:600;color:#1a73e8}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Swimming Results</h1>
<p style="color:#555">Search athletes. Click a name to see races.</p>
<input id="q" placeholder="Type a name (Wiffen, Schlosshan, Bailey...)" oninput="go()">
<div id="status" style="color:#666;font-size:13px;margin:8px 0"></div>
<div id="list"></div>
<div id="detail"></div>
</div>
</div>
<script>
var A=[{"n":"Daniel Wiffen","c":5,"r":[{"e":"1500 Free","t":"14:51.38","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"},{"e":"200 Free","t":"1:50.19","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"},{"e":"400 Free","t":"3:49.35","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"},{"e":"800 Free","t":"7:58.08","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"}]},{"n":"Nathan Wiffen","c":5,"r":[{"e":"400 Free","t":"3:54.12","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"},{"e":"1500 Free","t":"15:20.88","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"}]},{"n":"Ciara Schlosshan","c":6,"r":[{"e":"200 Fly","t":"2:08.60","p":1,"rt":null,"m":"BUCS Long Course","d":"2026-02-13"},{"e":"100 Fly","t":"58.38","p":1,"rt":null,"m":"BUCS Long Course","d":"2026-02-13"},{"e":"50 Fly","t":"26.97","p":1,"rt":null,"m":"BUCS Long Course","d":"2026-02-13"}]},{"n":"Leah Schlosshan","c":6,"r":[{"e":"100 Free","t":"55.02","p":1,"rt":null,"m":"BUCS Long Course","d":"2026-02-13"},{"e":"200 Free","t":"1:58.65","p":2,"rt":null,"m":"BUCS Long Course","d":"2026-02-13"}]},{"n":"Ellen Walshe","c":8,"r":[{"e":"200 IM","t":"2:13.51","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"},{"e":"400 IM","t":"4:39.38","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"}]},{"n":"Evan Bailey","c":4,"r":[{"e":"100 Free","t":"48.94","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"},{"e":"200 Free","t":"1:47.81","p":null,"rt":null,"m":"Irish Open & Commonwealth","d":"2026-04-08"}]}];
function go(){
  var q=document.getElementById("q").value.toLowerCase().trim();
  var list=document.getElementById("list");
  var status=document.getElementById("status");
  var detail=document.getElementById("detail");
  detail.innerHTML="";
  if(q.length<2){list.innerHTML="";status.textContent="Type at least 2 characters";return}
  var m=A.filter(function(a){return a.n.toLowerCase().indexOf(q)!==-1});
  status.textContent=m.length+" match"+(m.length===1?"":"es");
  if(!m.length){list.innerHTML="<p>No matches</p>";return}
  var h="<table><tr><th>Name</th><th>Results</th></tr>";
  for(var i=0;i<Math.min(m.length,10);i++){
    h+='<tr class="row" onclick="show(\''+m[i].n.replace(/'/g,"\\'")+'\')"><td>'+m[i].n+'</td><td>'+m[i].c+'</td></tr>';
  }
  h+="</table>";
  list.innerHTML=h;
  if(m.length===1) show(m[0].n);
  else detail.innerHTML='<p style="color:#666;margin-top:8px">Click an athlete to see races</p>';
}
function show(n){
  var a=A.find(function(x){return x.n===n});
  if(!a)return;
  var h="<h3>"+n+"</h3><table><tr><th>Event</th><th>Time</th><th>RT</th><th>Place</th><th>Meet</th><th>Date</th></tr>";
  for(var i=0;i<a.r.length;i++){
    var r=a.r[i];
    h+="<tr><td>"+r.e+"</td><td class='time'>"+r.t+"</td><td>"+(r.rt!=null?r.rt:"—")+"</td><td>"+(r.p||"—")+"</td><td>"+r.m+"</td><td>"+r.d+"</td></tr>";
  }
  h+="</table>";
  document.getElementById("detail").innerHTML=h;
}
</script>
<p style="text-align:center;color:#999;font-size:12px;padding:12px">Live dashboard</p>
</body>
</html>
