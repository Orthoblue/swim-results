<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Swim Results</title>
<style>
body{font-family:sans-serif;margin:20px}
input{padding:8px;width:320px;font-size:16px}
table{border-collapse:collapse;width:100%;margin-top:10px}
td,th{border:1px solid #ddd;padding:6px;text-align:left}
tr:hover{background:#f0f0f0;cursor:pointer}
.time{font-weight:bold;color:#0066cc}
</style>
</head>
<body>
<h2>Swimming Results Search</h2>
<p>Type a name (e.g. Schlosshan, Bailey, Wiffen):</p>
<input id="search" type="text" placeholder="Search athletes..." onkeyup="search()">
<div id="results"></div>
<div id="detail"></div>
<script>
var athletes = [{"name":"Jan Boersma","count":24,"races":[{"event":"100 Free","time":"54.96","place":null,"rt":null,"meet":"Irish Open","date":"2026-04-08"}]}];
function search(){
  var q = document.getElementById("search").value.toLowerCase();
  var div = document.getElementById("results");
  var detail = document.getElementById("detail");
  detail.innerHTML = "";
  if(q.length < 2){ div.innerHTML = "<p>Type at least 2 letters</p>"; return; }
  var matches = athletes.filter(function(a){ return a.name.toLowerCase().indexOf(q) !== -1; });
  if(!matches.length){ div.innerHTML = "<p>No matches</p>"; return; }
  var html = "<table><tr><th>Name</th><th>Results</th></tr>";
  for(var i=0; i<Math.min(matches.length,8); i++){
    var a = matches[i];
    html += '<tr onclick="show(\''+a.name.replace(/'/g,"\\'")+'\')"><td>'+a.name+'</td><td>'+a.count+'</td></tr>';
  }
  html += "</table>";
  div.innerHTML = html;
}
function show(name){
  var a = athletes.find(function(x){ return x.name === name; });
  if(!a) return;
  var html = "<h3>"+name+"</h3><table><tr><th>Event</th><th>Time</th><th>RT</th><th>Place</th><th>Meet</th><th>Date</th></tr>";
  for(var i=0; i<a.races.length; i++){
    var r = a.races[i];
    html += "<tr><td>"+r.event+"</td><td class='time'>"+r.time+"</td><td>"+(r.rt||"—")+"</td><td>"+(r.place||"—")+"</td><td>"+r.meet+"</td><td>"+r.date+"</td></tr>";
  }
  html += "</table>";
  document.getElementById("detail").innerHTML = html;
}
</script>
<p style="color:#666;font-size:12px">Hosted on GitHub Pages. Search works offline.</p>
</body>
</html>
